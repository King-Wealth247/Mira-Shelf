# Supabase local configuration (Section 9.2). Tracked in Git.
# Staging/production settings are applied per-project; this file governs the LOCAL stack.

project_id = "mira-shelf"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Deep-link redirect for password reset (Section 5.1 / 11.2). Update to the app scheme.
site_url = "mirashelf://"
additional_redirect_urls = ["mirashelf://reset-password"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# LOCAL ONLY exception for the 5-char dev seed password (Section 10.4, Risk callout).
# Staging and production keep the strict policy (min 8) and MUST NOT seed dev accounts.
minimum_password_length = 5

[auth.email]
enable_signup = true
# Local development auto-confirms; staging/production require confirmation (A-07 custom SMTP in prod).
enable_confirmations = false

[storage]
enabled = true
# Buckets are created by migration 0008_storage (book-content 30MB, book-covers 2MB).

[edge_runtime]
enabled = true
