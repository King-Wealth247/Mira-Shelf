name: CI

# Stage 0 skeleton. Jobs are wired to fail-soft (echo + exit 0) until the
# corresponding phase lands real tooling. Do NOT relax the secret-scan job.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    # Phase 0/3 — FR-DEV-04 / T-DEV-05: build fails if the dev password or a
    # service-role key pattern appears in tracked files.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for forbidden secrets in tracked files
        run: |
          set -e
          PATTERN='(service_role|SUPABASE_SERVICE_ROLE_KEY=.+[A-Za-z0-9]|eyJ[A-Za-z0-9_-]{20,}|\bDEV_SEED_PASSWORD=12345\b|alice@user\.com)'
          # Exclude template/docs/plan that legitimately mention these tokens.
          if git grep -nIE "$PATTERN" -- . \
              ':!.env.example' ':!IMPLEMENTATION_PLAN.md' ':!docs/**' ':!.github/**'; then
            echo "::error::Forbidden secret/credential pattern found in tracked files."
            exit 1
          fi
          echo "No forbidden secret patterns found."

  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: echo "TODO(Phase 4): npm ci && npm run lint && npm run typecheck"

  unit-component:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: echo "TODO(Phase 2+): jest unit + component tests"

  database-rls:
    # Phase 2 — BLOCKING: migrations on an empty DB + pgTAP RLS suite.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "TODO(Phase 2): supabase start; supabase db reset; supabase test db"

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "TODO(Phase 0/10): npm audit / dependency review"

  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "TODO(Phase 4/11): build debug APK"
